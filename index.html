<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI ATC · VATSIM-style controller sim with AI pilots</title>
<style>
:root{
  --bg:#07090c; --panel:#0d1117; --edge:#1b232e; --text:#c7d3dd; --dim:#5f7180;
  --accent:#38e07b; --cyan:#39c4e8; --yellow:#ffd75e; --red:#ff5252; --orange:#ffa53a;
  --mono:"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button,select{background:#131a22;color:var(--text);border:1px solid var(--edge);border-radius:4px;font-family:var(--mono);font-size:12px;padding:3px 10px;cursor:pointer}
button:hover{border-color:var(--dim)}
button.active{border-color:var(--accent);color:var(--accent)}
button.rec{border-color:var(--red);color:var(--red);animation:pulse 1s infinite}
button:disabled{opacity:.4;cursor:default}
@keyframes pulse{50%{opacity:.5}}
.dimtxt{color:var(--dim)}

header{display:flex;align-items:center;gap:12px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--edge);flex-wrap:wrap}
header .title{font-weight:700;letter-spacing:.12em;color:var(--accent);white-space:nowrap}
header .fac{color:var(--dim);font-size:12px;white-space:nowrap}
header .clock{color:var(--cyan);min-width:66px}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--edge);border-radius:4px;padding:2px 8px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--text)}
.chip.good b{color:var(--accent)}
.chip.bad b{color:var(--red)}

main{flex:1;display:flex;min-height:0}
#stripbay{width:240px;min-width:170px;background:var(--panel);border-right:1px solid var(--edge);overflow-y:auto;padding:6px}
#stripbay h3{margin:8px 2px 4px;font-size:11px;letter-spacing:.13em;color:var(--dim);font-weight:600;display:flex;justify-content:space-between}
#stripbay h3 .me{color:var(--accent)}
.strip{border:1px solid var(--edge);border-left:3px solid var(--cyan);border-radius:3px;padding:4px 6px;margin-bottom:4px;cursor:pointer;line-height:1.45;background:#0a0f14}
.strip.dep{border-left-color:var(--accent)}
.strip.sel{background:#18222d;border-color:var(--yellow)}
.strip .cs{font-weight:700}
.strip .meta{color:var(--dim);font-size:11px;display:flex;justify-content:space-between}
.strip .st{color:var(--cyan);font-size:11px}
.strip.dep .st{color:var(--accent)}
.strip.compact{padding:2px 6px;font-size:11px;display:flex;justify-content:space-between;color:var(--dim)}

/* vNAS-style flight strip */
.fstrip{border:1px solid var(--edge);border-left:3px solid var(--cyan);border-radius:3px;
  background:#0a0f14;margin-bottom:5px;padding:4px 6px;cursor:pointer;font-size:11px;line-height:1.35}
.fstrip.dep{border-left-color:var(--accent)}
.fstrip.sel{background:#18222d;border-color:var(--yellow)}
.fs-hd{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.fs-hd .cs{font-weight:700;font-size:12.5px;color:#9fd8ef}
.fstrip.dep .fs-hd .cs{color:#8fe8b0}
.fs-hd .cid{color:var(--dim)}
.fs-hd .ho{margin-left:auto;font-size:10px;padding:0 4px;border-radius:3px}
.fs-hd .ho.pend{color:#0a0f14;background:var(--orange)}
.fs-hd .ho.ok{color:#0a0f14;background:var(--accent)}
.fs-row{display:flex;gap:8px;margin-bottom:2px}
.fs-f{display:flex;flex-direction:column;min-width:0}
.fs-f i{font-style:normal;font-size:9px;color:var(--dim);letter-spacing:.06em}
.fs-rte{color:#8ab8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.fs-rte i{font-style:normal;font-size:9px;color:var(--dim);margin-right:5px;letter-spacing:.06em}
.fs-ft{display:flex;align-items:center;gap:6px;margin-top:2px}
.fs-ft .st{color:var(--cyan);font-size:10.5px}
.fstrip.dep .fs-ft .st{color:var(--accent)}
.hobtn{margin-left:auto;font-size:9.5px;padding:1px 6px}

#scopewrap{flex:1;position:relative;min-width:0;background:#000}
#scope{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#viewtabs{position:absolute;bottom:34px;left:10px;display:flex;gap:6px;z-index:5}

#commsbay{width:340px;min-width:250px;background:var(--panel);border-left:1px solid var(--edge);display:flex;flex-direction:column}
#freqtabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--edge)}
#freqtabs .ftab{flex:1;min-width:52px;text-align:center;padding:6px 2px;cursor:pointer;color:var(--dim);font-size:11px;border-right:1px solid var(--edge);position:relative;user-select:none}
#freqtabs .ftab.on{color:var(--accent);background:#0a141c}
#freqtabs .ftab .dot{position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--yellow);display:none}
#freqtabs .ftab.unread .dot{display:block}
#freqtabs .ftab .mon{display:block;font-size:9px;color:var(--dim)}
#freqtabs .ftab.monon .mon{color:var(--cyan)}
#log{flex:1;overflow-y:auto;padding:8px 10px;line-height:1.5}
#log .row{margin-bottom:7px;word-wrap:break-word}
#log .t{color:#3b4a57;margin-right:6px;font-size:11px}
#log .you{color:var(--accent)}
#log .pilot{color:var(--text)}
#log .ctrl{color:#8ab8ff}
#log .sys{color:var(--yellow)}
#log .warn{color:var(--red)}
#log .who{font-weight:700}
#cheat{border-top:1px solid var(--edge);padding:6px 8px;max-height:34%;overflow-y:auto}
#cheat .lbl{font-size:10px;color:var(--dim);letter-spacing:.12em;margin-bottom:4px}
.cheatsel{font-size:11px;color:var(--yellow);margin-bottom:5px}
.cheatrow{cursor:pointer;padding:3px 4px;border-radius:3px;margin-bottom:2px;line-height:1.3}
.cheatrow:hover{background:#16202a}
.cheatrow code{display:block;font-size:10.5px;color:var(--accent);background:none;padding:0}
.cheatrow i{font-style:normal;font-size:9.5px;color:var(--dim)}
#intercom{border-top:1px solid var(--edge);padding:6px 8px}
#intercom .lbl{font-size:10px;color:var(--dim);letter-spacing:.12em;margin-bottom:4px}
#intercom .btns{display:flex;gap:5px;flex-wrap:wrap}

footer{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--edge);align-items:center}
footer .freq{color:var(--dim);white-space:nowrap;font-size:12px}
#cmd{flex:1;background:#05130b;color:var(--accent);border:1px solid var(--edge);border-radius:4px;font-family:var(--mono);font-size:14px;padding:7px 10px;outline:none}
#cmd:focus{border-color:var(--accent)}
#cmd::placeholder{color:#2c5540}

.overlay{position:fixed;inset:0;background:rgba(2,4,6,.9);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:30px 0}
.overlay.open{display:flex}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:8px;max-width:880px;width:94%;padding:22px 28px;line-height:1.6;margin-bottom:40px}
.card h2{color:var(--accent);letter-spacing:.1em;margin-top:0}
.card h4{color:var(--cyan);margin:14px 0 6px;letter-spacing:.06em}
.card code{background:#05130b;color:var(--accent);padding:1px 6px;border-radius:3px}
.card table{border-collapse:collapse;width:100%}
.card td{padding:3px 8px;border-bottom:1px solid var(--edge);vertical-align:top}
.card td:first-child{white-space:nowrap;color:var(--accent)}
.facgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.faccard{border:1px solid var(--edge);border-radius:6px;padding:10px;cursor:pointer}
.faccard:hover{border-color:var(--dim)}
.faccard.sel{border-color:var(--accent);background:#0a141c}
.faccard .artcc{color:var(--accent);font-weight:700;letter-spacing:.08em}
.faccard .ap{color:var(--text);margin:3px 0;font-size:12px}
.faccard .meta{color:var(--dim);font-size:11px}
.posgrid{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.poscard{border:1px solid var(--edge);border-radius:6px;padding:10px 14px;cursor:pointer;min-width:130px}
.poscard:hover{border-color:var(--dim)}
.poscard.sel{border-color:var(--accent);background:#0a141c}
.poscard.locked{opacity:.45;cursor:not-allowed}
.poscard .pn{font-weight:700}
.poscard .pr{font-size:11px;color:var(--dim)}
.ratebox{border:1px solid var(--edge);border-radius:6px;padding:10px 14px;margin:12px 0;font-size:12px}
.ratebox b{color:var(--yellow)}
.menurow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0}
.bigbtn{font-size:15px;padding:10px 26px;border-color:var(--accent);color:var(--accent)}
.close{float:right}
.tdlsrow{display:flex;align-items:center;gap:12px;border:1px solid var(--edge);border-radius:6px;
  padding:8px 10px;margin:7px 0;font-size:12px}
.tdlsrow button{margin-left:auto;white-space:nowrap}
.fpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin:12px 0}
.fpf{border:1px solid var(--edge);border-radius:4px;padding:5px 8px}
.fpf i{display:block;font-style:normal;font-size:9.5px;color:var(--dim);letter-spacing:.08em}
.fpf b{color:#8ab8ff;font-size:13px}
.fprte{border:1px solid var(--edge);border-radius:4px;padding:6px 8px;margin:8px 0;color:#8ab8ff}
.fprte i{font-style:normal;font-size:9.5px;color:var(--dim);letter-spacing:.08em;margin-right:8px}

@media (max-width:1050px){
  #stripbay{width:180px}
  #commsbay{width:260px;min-width:220px}
}
</style>
</head>
<body>

<header>
  <span class="title">AI ATC</span><span class="fac" id="build" title="Build number. If this does not match what Claude reports, your browser is serving a cached copy: hard-refresh with Ctrl+Shift+R.">b10</span>
  <span class="fac" id="facinfo">offline</span>
  <span class="clock" id="clock">00:00:00</span>
  <div class="chips">
    <span class="chip good">SCORE <b id="scScore">0</b></span>
    <span class="chip">RATING <b id="scRating">S1</b></span>
    <span class="chip">PTS <b id="scPts">0</b></span>
    <button id="btnTdls" title="vTDLS: send a pre-departure clearance by datalink">TDLS</button>
    <button id="btnSop" title="Facility standard operating procedures for this session">SOP</button>
    <button id="btnAtis" title="Show and play the current ATIS">ATIS</button>
    <button id="btnSpeed" title="Simulation rate">1&times;</button>
    <button id="btnPause" title="Pause (P)">PAUSE</button>
    <button id="btnVoice" class="active" title="Radio voices on/off">VOICES ON</button>
    <button id="btnHelp">HELP</button>
    <button id="btnMenu" title="Disconnect, back to position select">MENU</button>
  </div>
</header>

<main>
  <aside id="stripbay"></aside>
  <div id="scopewrap">
    <div id="viewtabs">
      <button data-v="STARS" class="active">STARS</button>
      <button data-v="ASDX">ASDE-X</button>
      <button data-v="CAB">TWR CAB</button>
    </div>
    <canvas id="scope"></canvas>
  </div>
  <aside id="commsbay">
    <div id="freqtabs"></div>
    <div id="log"></div>
    <div id="cheat"></div>
    <div id="intercom">
      <div class="lbl">LANDLINES</div>
      <div class="btns" id="intbtns"></div>
    </div>
  </aside>
</main>

<footer>
  <span class="freq" id="txlabel">TX&gt;</span>
  <input id="cmd" autocomplete="off" spellcheck="false" placeholder="">
  <button id="btnSend">XMIT</button>
  <button id="btnMic" title="Push-to-talk: press and HOLD while speaking, release to transmit. Or hold Tab. Chrome/Edge, allow the microphone.">&#127908; PTT</button>
</footer>

<div class="overlay open" id="menu"><div class="card" id="menucard"></div></div>
<div class="overlay" id="help"><div class="card" id="helpcard"></div></div>
<div class="overlay" id="sop"><div class="card" id="sopcard"></div></div>
<div class="overlay" id="tdls"><div class="card" id="tdlscard"></div></div>
<div class="overlay" id="fp"><div class="card" id="fpcard"></div></div>

<script src="airports.js?v=10"></script>
<script src="data.js?v=10"></script>
<script src="audio.js?v=10"></script>
<script src="engine.js?v=10"></script>
<script src="geo.js?v=10"></script>
<script src="views.js?v=10"></script>
<script src="dcb.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
